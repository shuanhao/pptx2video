[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pptx2video"
version = "0.3.0"
description = "Parse PowerPoint notes and export slide metadata as JSON"
requires-python = ">=3.9"
dependencies = [
  "python-pptx>=0.6.21",
  "edge-tts>=6.1.9",
  "pydub>=0.25.1",
  "pywin32>=306; sys_platform == 'win32'",
]

[tool.setuptools]
packages = ["src", "pptx2video"]

[project.scripts]
pptx2video = "src.main:main"
