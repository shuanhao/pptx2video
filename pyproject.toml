[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pptx2video"
version = "0.8.0"
description = "Convert PowerPoint presentations into narrated MP4 videos, with aligned SRT subtitles, using Edge-TTS and PowerPoint automation"
requires-python = ">=3.9"
dependencies = [
  "python-pptx>=0.6.21",
  "edge-tts>=7.2.0",
  "pydub>=0.25.1",
  "jieba>=0.42.1",
  "numpy>=1.24",
  "scipy>=1.10",
  "pywin32>=306; sys_platform == 'win32'",
  # See requirements.txt's comment: pydub still needs the stdlib `audioop`
  # module, which Python 3.13 removed - this backport restores it, only on
  # 3.13+.
  "audioop-lts; python_version >= '3.13'",
]

[project.optional-dependencies]
# Not required to run pptx2video itself - only for running/developing the
# test suite. tests/ currently work fine with the stdlib `unittest`
# (`python -m unittest discover -s tests -v`); pytest is an optional,
# more convenient runner (shorter output, `-k` test filtering, etc.), not
# a hard requirement. Install with: pip install -e ".[dev]"
dev = [
  "pytest>=7.0",
]

[tool.setuptools]
packages = ["src", "pptx2video"]

[project.scripts]
pptx2video = "src.main:main"
