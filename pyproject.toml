[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pptx2video"
version = "0.1.0"
description = "Parse PowerPoint notes and export slide metadata as JSON"
requires-python = ">=3.9"
dependencies = [
  "python-pptx>=0.6.21",
]

[tool.setuptools]
packages = ["src"]
