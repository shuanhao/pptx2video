[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pptx2video"
version = "0.4.1"
description = "Convert PowerPoint presentations into narrated MP4 videos using Edge-TTS and PowerPoint automation"
requires-python = ">=3.9"
dependencies = [
  "python-pptx>=0.6.21",
  "edge-tts>=7.2.0",
  "pydub>=0.25.1",
  "jieba>=0.42.1",
  "pywin32>=306; sys_platform == 'win32'",
]

[tool.setuptools]
packages = ["src", "pptx2video"]

[project.scripts]
pptx2video = "src.main:main"
